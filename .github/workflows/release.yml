name: Release

# One .deb, for COSMIC. GNOME is not packaged as a .deb at all: mutter has no
# layer-shell and will not position or stack a plain toplevel, so nothing an
# ordinary process can put on screen works as an overlay there. The GNOME build
# is the shell extension in gnome-extension/, published to extensions.gnome.org
# by publish-extension.yml.
on:
  push:
    tags: ["v*"]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libexpat1-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev libssl-dev \
            libgbm-dev libpipewire-0.3-dev libpulse-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build package
        run: cargo deb --output ringlight-cosmic.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ringlight $GITHUB_REF_NAME" \
            --generate-notes \
            ringlight-cosmic.deb#"Pop!_OS (COSMIC desktop)"
