[package]
name = "ringlight"
version = "0.2.0"
edition = "2021"
description = "Desktop ring light overlay for Pop!_OS (COSMIC Desktop)"
license = "GPL-3.0"
authors = ["Jean Naude"]
repository = "https://github.com/twigglits/ringlight"
keywords = ["ringlight", "webcam", "overlay", "cosmic", "wayland"]
categories = ["gui"]

[dependencies]
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
futures-util = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
dirs = "6"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "applet",
    "tokio",
    "wgpu",
]

[package.metadata.deb]
name = "ringlight-cosmic"
maintainer = "Jean Naude"
# cosmic-panel is Recommends, not Depends: without it the applet has nothing to
# load it, but hard-depending on a package name that differs across Pop!_OS,
# Ubuntu and Debian COSMIC repos would fail the install outright.
depends = "$auto"
recommends = "cosmic-panel"
conflicts = "ringlight-gnome"
provides = "ringlight"
section = "utils"
priority = "optional"
extended-description = """\
Adds a soft warm glow around the edges of your screen to act as a ring light \
during video calls, and turns itself on when your webcam does. This is the \
COSMIC build: a cosmic-panel applet driving a Wayland layer-shell overlay \
rendered on the GPU. For GNOME install ringlight-gnome instead."""
assets = [
    ["target/release/ringlight", "usr/bin/", "755"],
    ["ringlight.desktop", "usr/share/applications/", "644"],
    ["LICENSE", "usr/share/doc/ringlight-cosmic/", "644"],
]
