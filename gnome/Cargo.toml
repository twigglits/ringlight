[package]
name = "ringlight-gnome"
version = "0.2.0"
edition = "2021"
description = "Desktop ring light overlay for Debian/Ubuntu (GNOME on Wayland)"
license = "GPL-3.0"
authors = ["Jean Naude"]
repository = "https://github.com/twigglits/ringlight"
keywords = ["ringlight", "webcam", "overlay", "gnome", "wayland"]
categories = ["gui"]

# Deliberately its own workspace: this crate is GTK3/cairo/ksni, the root crate is
# libcosmic. Sharing a lockfile would force one dependency resolution across two
# unrelated toolkits.
[workspace]

# Both packages ship the same command name and Conflict with each other, so a user
# installs the one matching their desktop and types `ringlight` either way.
[[bin]]
name = "ringlight"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdk = "0.18"
cairo-rs = "0.18"
gio = "0.18"
glib = "0.18"
ksni = "0.2"

[build-dependencies]
pkg-config = "0.3"

[package.metadata.deb]
name = "ringlight-gnome"
maintainer = "Jean Naude"
depends = "$auto, gnome-shell"
conflicts = "ringlight-cosmic"
provides = "ringlight"
section = "utils"
priority = "optional"
extended-description = """\
Adds a soft warm glow around the edges of your screen to act as a ring light \
during video calls, and turns itself on when your webcam does. This is the \
GNOME build: a system-tray app drawing a GTK3/cairo layer-shell overlay. \
For the COSMIC desktop install ringlight-cosmic instead."""
assets = [
    ["target/release/ringlight", "usr/bin/", "755"],
    ["ringlight.desktop", "usr/share/applications/", "644"],
    ["../LICENSE", "usr/share/doc/ringlight-gnome/", "644"],
]
